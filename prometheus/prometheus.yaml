global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']

  - job_name: task-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['task-service-1:8080', 'task-service-2:8080', 'task-service-3:8080']
