spring.application.name=task-service
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

spring.datasource.url=jdbc:postgresql://task-db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Tempos em milissegundos para vincular tarefas a projetos.
spring.cloud.openfeign.client.config.project-service.connectTimeout=1000
spring.cloud.openfeign.client.config.project-service.readTimeout=2000

# Circuitos das chamadas HTTP remotas: erros 4xx não indicam indisponibilidade.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=feign.FeignException$FeignServerException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=feign.RetryableException
resilience4j.circuitbreaker.instances.projectTaskAssignment.base-config=default

# Broker e confirmações: a outbox só é removida após ACK sem retorno por falta de rota.
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:taskflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:taskflow-local}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Publicação dos eventos de ciclo de vida pela outbox (intervalo em milissegundos).
taskflow.lifecycle-events.publish-delay-milliseconds=5000
