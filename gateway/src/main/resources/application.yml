server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          routes:
            - id: tasks
              uri: lb://task-service
              predicates:
                - Path=/api/v1/tasks,/api/v1/tasks/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: taskServiceCircuitBreaker
                    fallbackUri: forward:/fallback/tasks
                    statusCodes:
                      - 502
                      - 503
                      - 504
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    exceptions:
                      - java.io.IOException
                      - java.util.concurrent.TimeoutException
            - id: task-health
              uri: lb://task-service
              predicates:
                - Path=/api/v1/health,/api/v1/health/**
              filters:
                - 'RewritePath=/api/v1/health(?<remaining>/?.*), /actuator/health${remaining}'
                - name: CircuitBreaker
                  args:
                    name: taskServiceHealthCircuitBreaker
                    fallbackUri: forward:/fallback/health
                    statusCodes:
                      - 502
                      - 503
                      - 504
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET
                    exceptions:
                      - java.io.IOException
                      - java.util.concurrent.TimeoutException
    loadbalancer:
      cache:
        ttl: 5s

resilience4j:
  circuitbreaker:
    instances:
      taskServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
      taskServiceHealthCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
