services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-taskflow}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-taskflow-local}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      APP_VERSION: "${APP_VERSION:-1.0.0}"

  gateway:
    build:
      context: ./gateway
    ports:
      - "8081:8080"
    environment:
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      - eureka-server
      - task-service-1
      - task-service-2
      - task-service-3
      - project-service
      - zipkin

  task-db:
    image: postgres:17-alpine
    env_file:
      - ./task-service/.env
    volumes:
      - task_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  task-service-1:
    build:
      context: ./task-service
    expose:
      - "8080"
    env_file:
      - ./task-service/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:-taskflow}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-taskflow-local}"
      TASK_INSTANCE: "1"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      project-service:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started
      task-db:
        condition: service_healthy

  task-service-2:
    build:
      context: ./task-service
    expose:
      - "8080"
    env_file:
      - ./task-service/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:-taskflow}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-taskflow-local}"
      TASK_INSTANCE: "2"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      project-service:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started
      task-db:
        condition: service_healthy

  task-service-3:
    build:
      context: ./task-service
    expose:
      - "8080"
    env_file:
      - ./task-service/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:-taskflow}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-taskflow-local}"
      TASK_INSTANCE: "3"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      project-service:
        condition: service_started
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started
      task-db:
        condition: service_healthy

  project-db:
    image: postgres:17-alpine
    env_file:
      - ./project-service/.env
    volumes:
      - project_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  project-service:
    build:
      context: ./project-service
    expose:
      - "8080"
    env_file:
      - ./project-service/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER:-taskflow}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-taskflow-local}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      zipkin:
        condition: service_started
      project-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  rabbitmq_data:
  grafana_data:
  task_db_data:
  project_db_data:
