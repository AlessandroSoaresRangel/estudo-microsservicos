services:
  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      APP_VERSION: "${APP_VERSION:-1.0.0}"

  gateway:
    build:
      context: ./gateway
    ports:
      - "8081:8080"
    environment:
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      - eureka-server
      - task-service-1
      - task-service-2
      - task-service-3

  task-service-1:
    build:
      context: ./task-service
    expose:
      - "8080"
    environment:
      TASK_INSTANCE: "1"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      - eureka-server

  task-service-2:
    build:
      context: ./task-service
    expose:
      - "8080"
    environment:
      TASK_INSTANCE: "2"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      - eureka-server

  task-service-3:
    build:
      context: ./task-service
    expose:
      - "8080"
    environment:
      TASK_INSTANCE: "3"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    depends_on:
      - eureka-server
